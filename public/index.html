<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI Chat">
<title>AI Chat</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <button class="new-chat" id="newChat" data-i18n="newChat">+ چت جدید</button>
      <input id="convSearch" type="search" data-i18n-ph="searchPh" placeholder="جستجو توی چت‌ها">
    </div>
    <div class="conv-list" id="convList"></div>
    <div class="side-foot">
      <button id="openSettings2"><img src="/gear.png" alt=""><span data-i18n="settings">تنظیمات</span></button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="settingsBtn" data-i18n-title="settings"><img src="/gear.png" alt=""></button>
      <div class="title-wrap">
        <div class="title" id="chatTitle" dir="auto"></div>
        <div class="sub" id="modelLabel" dir="ltr"></div>
      </div>
      <button class="icon-btn" id="exportBtn" data-i18n-title="export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>
      </button>
      <button class="icon-btn" id="menuBtn" data-i18n-title="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
    </header>

    <section class="messages" id="messages"></section>
    <button class="to-bottom" id="toBottom" data-i18n-title="toBottom" hidden>↓</button>
    <div class="attach-bar" id="attachBar"></div>

    <footer class="composer">
      <button class="icon-btn" id="attachBtn" data-i18n-title="attach"><img src="/clip.png" alt=""></button>
      <input type="file" id="fileInput" multiple hidden>
      <button class="icon-btn" id="micBtn" data-i18n-title="mic"><img src="/mic.png" alt=""></button>
      <textarea id="input" rows="1" data-i18n-ph="placeholder"></textarea>
      <button class="send-btn" id="sendBtn" data-i18n-title="send"><img src="/send.png" alt=""></button>
    </footer>
  </main>
</div>

<div class="toast" id="toast" hidden></div>

<div class="modal" id="settingsModal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <strong data-i18n="settings">تنظیمات</strong>
      <button class="icon-btn" id="closeSettings" data-i18n-title="close">✕</button>
    </div>

    <div class="section">
      <h4 data-i18n="sGeneral">عمومی</h4>
      <label><span data-i18n="sLang">زبان</span>
        <div class="seg" id="langSeg">
          <button type="button" data-val="fa">فارسی</button>
          <button type="button" data-val="en">English</button>
        </div>
      </label>
      <label><span data-i18n="sTheme">تم</span>
        <div class="seg" id="themeSeg">
          <button type="button" data-val="system" data-i18n="themeSystem">سیستم</button>
          <button type="button" data-val="dark" data-i18n="themeDark">تاریک</button>
          <button type="button" data-val="light" data-i18n="themeLight">روشن</button>
        </div>
      </label>
    </div>

    <div class="section">
      <h4 data-i18n="sApi">اتصال API</h4>
      <label><span data-i18n="sApiUrl">آدرس API</span>
        <input id="setBase" type="text" dir="ltr" placeholder="https://.../v1">
      </label>
      <label><span>API Key</span>
        <input id="setKey" type="password" dir="ltr" placeholder="sk-..." autocomplete="off">
      </label>
      <label class="check"><input id="setRemember" type="checkbox"> <span data-i18n="sRemember">کلید رو روی این دستگاه نگه دار</span></label>
      <div class="hint" data-i18n="sSecretWarn">اگه غیر از خودت کسی به این دستگاه دسترسی داره، تیک «نگه دار» رو بردار.</div>
      <label><span data-i18n="sAppPass">رمز ورود سایت</span>
        <input id="setAppPass" type="password" dir="ltr" data-i18n-ph="sAppPassPh" autocomplete="off">
      </label>
      <label><span data-i18n="sModel">مدل</span>
        <div class="row">
          <select id="setModel" dir="ltr"></select>
          <button class="icon-btn" id="loadModels" type="button" data-i18n-title="sRefresh">↻</button>
        </div>
      </label>
    </div>

    <div class="section">
      <h4 data-i18n="sChat">تنظیمات چت</h4>
      <label><span data-i18n="sSystem">System prompt</span>
        <textarea id="setSystem" class="field" rows="3" data-i18n-ph="sSystemPh"></textarea>
      </label>
      <label><span data-i18n="sTemp">خلاقیت</span>
        <input id="setTemp" type="number" min="0" max="2" step="0.1" dir="ltr">
      </label>
      <label><span data-i18n="sMax">حداکثر توکن</span>
        <input id="setMax" type="number" min="1" step="1" dir="ltr">
      </label>
      <label><span data-i18n="sHistory">تعداد پیام‌های آخر که فرستاده میشن (۰ = همه)</span>
        <input id="setHistory" type="number" min="0" step="1" dir="ltr">
      </label>
      <label class="check"><input id="setStream" type="checkbox"> <span data-i18n="sStream">پاسخ استریم</span></label>
      <label class="check"><input id="setSpeak" type="checkbox"> <span data-i18n="sSpeak">پاسخ‌ها رو با صدا بخون</span></label>
    </div>

    <div class="section">
      <h4 data-i18n="sSync">همگام‌سازی بین دستگاه‌ها</h4>
      <label><span data-i18n="sSyncCode">کد همگام‌سازی (حداقل ۸ کاراکتر)</span>
        <input id="setSync" type="password" dir="ltr" autocomplete="off">
      </label>
      <div class="row">
        <button class="btn ghost" id="syncNow" type="button" data-i18n="syncNow">همگام‌سازی الان</button>
      </div>
      <div class="hint" id="syncStatus" data-i18n="syncOff">همگام‌سازی خاموشه</div>
      <div class="hint" data-i18n="sSyncHint">همین کد رو روی دستگاه دیگه هم بذار. مثل رمز نگهش دار.</div>
    </div>

    <div class="section">
      <h4 data-i18n="sData">داده‌ها</h4>
      <div class="row">
        <button class="btn ghost" id="exportAll" type="button" data-i18n="exportAll">خروجی کل چت‌ها</button>
        <button class="btn ghost" id="importBtn" type="button" data-i18n="importAll">وارد کردن فایل پشتیبان</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </div>

    <div class="section danger-zone">
      <h4 data-i18n="sDanger">منطقه خطر</h4>
      <div class="row">
        <button class="btn ghost" id="deleteChat" type="button" data-i18n="deleteChat">حذف این چت</button>
        <button class="btn ghost" id="resetSettings" type="button" data-i18n="resetSettings">بازگشت به تنظیمات اولیه</button>
        <button class="btn danger" id="clearAll" type="button" data-i18n="clearAll">پاک کردن همه چت‌ها</button>
      </div>
    </div>

    <div class="modal-foot">
      <span class="hint" data-i18n="hint">کلید و تنظیمات فقط داخل همین مرورگر ذخیره میشن.</span>
      <button class="btn primary" id="saveSettings" type="button" data-i18n="save">ذخیره</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
